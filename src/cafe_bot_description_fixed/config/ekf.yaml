ekf_filter_node:
    ros__parameters:
        frequency: 30.0
        
        two_d_mode: true

        publish_acceleration: false

        publish_tf: true
        
        map_frame: map              
        odom_frame: odom            
        base_link_frame: base_link  
        world_frame: odom           
        
        odom0: /demo/odom
        odom0_config: [true,  true,  false,   # X, Y, ignore Z
                       false, false, true,    # Ignore Roll/Pitch, track Yaw
                       true,  true,  false,   # X velocity, Y velocity, ignore Z velocity
                       false, false, true,    # Ignore Roll/Pitch velocity, track Yaw velocity
                       false, false, false]   # Ignore accelerations

        imu0: /demo/imu
        imu0_config: [false, false, false,
                      false, false, false,    # Don't fuse raw orientation angles (prevent drift)
                      false, false, false,
                      false, false, true,     # Fuse angular velocity around Z (Yaw rate)
                      true,  true,  false]    # Fuse X and Y linear acceleration
